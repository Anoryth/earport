name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    name: Build and test daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libbluetooth-dev

      - name: Build
        run: |
          meson setup daemon/build daemon
          ninja -C daemon/build

      - name: Test
        run: meson test -C daemon/build --print-errorlogs

      # Memory errors in timers and D-Bus callbacks don't always crash:
      # catch them before a release does
      - name: Test with sanitizers
        run: |
          meson setup daemon/build-asan daemon -Db_sanitize=address,undefined
          ninja -C daemon/build-asan
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            meson test -C daemon/build-asan --print-errorlogs

  translations:
    name: Check translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Check .po files
        run: |
          for po in po/*.po; do
            msgfmt --check -o /dev/null "$po"
          done

      - name: Check every translation is compiled
        run: |
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            mo="extension/locale/$lang/LC_MESSAGES/earport.mo"
            if [ ! -f "$mo" ]; then
              echo "::error file=$po::Missing $mo (run: msgfmt --check -o $mo $po)"
              exit 1
            fi
          done

  lint:
    name: Lint extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ESLint
        run: npm ci

      - name: ESLint
        run: npx eslint extension

  extension:
    name: Pack extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libglib2.0-bin zip

      - name: Pack
        run: tools/pack-extension.sh

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.shell-extension.zip
