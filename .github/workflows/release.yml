name: Release

# On a version tag: build the service for x86_64 and aarch64, pack the
# extension, and prepare a draft GitHub release with everything
# install-daemon.sh needs. The draft is published by hand after review.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  daemon:
    name: Build service (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Oldest supported base: the binary then runs on newer systems too
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libbluetooth-dev

      - name: Build and test
        run: |
          # Without the HD microphone: linking FFmpeg would tie the binary to
          # one distribution's libavcodec (the packages have it)
          meson setup build daemon --buildtype=release -Dhd_mic=disabled
          ninja -C build
          meson test -C build --print-errorlogs

      - name: Check runtime dependencies
        run: |
          # Only GLib and the C library: libbluetooth must not come back
          ! ldd build/earport-daemon | grep -q libbluetooth

      - name: Pack
        run: tools/pack-daemon.sh build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon-${{ matrix.arch }}
          path: dist/*.tar.gz

  extension:
    name: Pack extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libglib2.0-bin zip

      - name: Pack
        run: tools/pack-extension.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension
          path: dist/*.shell-extension.zip

  release:
    name: Draft release
    needs: [daemon, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # signs the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cp install-daemon.sh dist/
          (cd dist && sha256sum earport-daemon-linux-*.tar.gz install-daemon.sh *.shell-extension.zip > SHA256SUMS)

      # Proves each file was built here from the tag: gh attestation verify
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "EarPort ${GITHUB_REF_NAME#v}" \
            --notes "Release notes to be written before publishing." \
            dist/*
